<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>CHINOTECH1: X-CITY Alpha 2</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071018;font-family:Arial}
canvas{display:block}
#cover{
 position:fixed;inset:0;z-index:100;
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;text-align:center;color:white;
 background:radial-gradient(circle at 50% 35%,#164b62,#02070b 72%);
}
#cover h1{font-size:clamp(50px,13vw,110px);margin:8px 0}
#cover h1 span{color:#55d6ff}
#cover p{letter-spacing:4px;color:#a9c3ce}
button{
 border:0;border-radius:12px;padding:14px 22px;
 background:#55d6ff;color:#061018;font-weight:900;
 cursor:pointer
}
#cover button{font-size:17px;margin-top:25px}
#hud{
 position:fixed;top:14px;left:14px;z-index:10;
 padding:12px;background:#000b;border-radius:13px;
 color:white;font-size:13px;line-height:1.6;
 border:1px solid #ffffff22
}
.logo{font-weight:900;color:#55d6ff;letter-spacing:3px}
#msg{
 position:fixed;top:18%;left:50%;
 transform:translateX(-50%);
 background:#000d;color:white;padding:13px 20px;
 border-radius:12px;display:none;z-index:30
}
#mobile{
 position:fixed;bottom:18px;left:15px;right:15px;
 display:flex;justify-content:space-between;
 z-index:20;pointer-events:none
}
.pad{width:155px;height:155px;position:relative;pointer-events:auto}
.key{
 position:absolute;width:52px;height:52px;
 border-radius:50%;background:#ffffff25;
 border:1px solid #ffffff44;color:white;
 display:flex;align-items:center;justify-content:center;
 font-size:21px;user-select:none
}
.u{left:51px;top:0}.d{left:51px;bottom:0}
.l{left:0;top:51px}.r{right:0;top:51px}
.actions{
 display:flex;gap:9px;align-items:flex-end;
 pointer-events:auto
}
.action{
 width:62px;height:62px;padding:0;margin:0;
 border-radius:50%;background:#55d6ff33;color:white;
 border:1px solid #55d6ff66
}
</style>
</head>

<body>

<div id="cover">
  <div style="letter-spacing:8px;color:#55d6ff;font-weight:bold">
    CHINOTECH1
  </div>
  <h1>X-<span>CITY</span></h1>
  <p>3D OPEN-WORLD • ALPHA 2</p>
  <button onclick="startGame()">▶ START GAME</button>
</div>

<div id="hud">
  <div class="logo">CHINOTECH1 • X-CITY</div>
  <div>❤️ Health: <span id="health">100</span></div>
  <div>💰 Money: $<span id="money">1000</span></div>
  <div>🚗 Vehicle: <span id="vehicle">On Foot</span></div>
  <div>⌨ WASD Move • SHIFT Run • SPACE Jump</div>
  <div>⌨ E Enter/Exit • R Reset</div>
</div>

<div id="msg"></div>

<div id="mobile">
  <div class="pad">
    <div class="key u" data-key="w">▲</div>
    <div class="key d" data-key="s">▼</div>
    <div class="key l" data-key="a">◀</div>
    <div class="key r" data-key="d">▶</div>
  </div>

  <div class="actions">
    <button class="action" onclick="jump()">⬆</button>
    <button class="action" onclick="enterExit()">🚗</button>
    <button class="action" onclick="resetGame()">↻</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>

<script>
/* =========================================================
   CHINOTECH1: X-CITY
   ALPHA 2 — SINGLE FILE
   ========================================================= */

let scene,camera,renderer;
let player,car;
let driving=false;
let started=false;
let verticalVelocity=0;
let grounded=true;

const keys={
 w:false,a:false,s:false,d:false,
 shift:false
};

const npcs=[];
const clock=new THREE.Clock();

/* ================= START ================= */

function startGame(){
  document.getElementById("cover").style.display="none";
  started=true;
  init();
}

/* ================= INITIALIZE ================= */

function init(){

  scene=new THREE.Scene();

  scene.background=new THREE.Color(0x8fc9e6);

  scene.fog=new THREE.Fog(
    0x8fc9e6,
    120,
    1000
  );

  camera=new THREE.PerspectiveCamera(
    65,
    innerWidth/innerHeight,
    .1,
    1800
  );

  renderer=new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
  });

  renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
  );

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.shadowMap.enabled=true;

  renderer.shadowMap.type=
    THREE.PCFSoftShadowMap;

  document.body.appendChild(
    renderer.domElement
  );

  /* LIGHTING */

  scene.add(
    new THREE.HemisphereLight(
      0xbfeaff,
      0x304030,
      2.1
    )
  );

  const sun=
    new THREE.DirectionalLight(
      0xffffff,
      3
    );

  sun.position.set(
    200,450,200
  );

  sun.castShadow=true;

  sun.shadow.mapSize.width=2048;
  sun.shadow.mapSize.height=2048;

  scene.add(sun);

  createWorld();
  createPlayer();
  createCar();
  createNPCs();

  loadGame();

  addEventListener(
    "resize",
    resize
  );

  animate();
}

/* ================= WORLD ================= */

function createWorld(){

  const ground=
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        1500,1500
      ),
      new THREE.MeshStandardMaterial({
        color:0x36583e
      })
    );

  ground.rotation.x=-Math.PI/2;
  ground.receiveShadow=true;

  scene.add(ground);

  /* roads */

  for(
    let p=-650;
    p<=650;
    p+=100
  ){

    makeRoad(
      p,0,
      34,1400
    );

    makeRoad(
      0,p,
      1400,34
    );
  }

  /* buildings */

  for(
    let x=-600;
    x<=600;
    x+=100
  ){

    for(
      let z=-600;
      z<=600;
      z+=100
    ){

      if(Math.random()<.16)
        continue;

      const h=
        20+
        Math.random()*85;

      makeBuilding(
        x+25,
        z+25,
        54+Math.random()*20,
        h,
        54+Math.random()*20
      );
    }
  }

  makeSpecial(
    -300,-300,
    100,125,100,
    0x172f3d,
    "X-HOTEL"
  );

  makeSpecial(
    300,-300,
    100,90,100,
    0x29383e,
    "X-BANK"
  );

  makeSpecial(
    300,300,
    130,60,100,
    0x123d49,
    "X-MALL"
  );

  makeSpecial(
    -300,300,
    110,45,100,
    0x333b42,
    "GARAGE"
  );
}

/* ================= ROAD ================= */

function makeRoad(
  x,z,w,d
){

  const road=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,.08,d
      ),
      new THREE.MeshStandardMaterial({
        color:0x292d31
      })
    );

  road.position.set(
    x,.04,z
  );

  scene.add(road);
}

/* ================= BUILDING ================= */

function makeBuilding(
  x,z,w,h,d
){

  const colors=[
    0x33434d,
    0x455a64,
    0x263238,
    0x37474f,
    0x50646e
  ];

  const building=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,h,d
      ),
      new THREE.MeshStandardMaterial({
        color:
          colors[
            Math.floor(
              Math.random()*
              colors.length
            )
          ],
        roughness:.65
      })
    );

  building.position.set(
    x,h/2,z
  );

  building.castShadow=true;
  building.receiveShadow=true;

  scene.add(building);

  const windows=
    new THREE.MeshStandardMaterial({
      color:0x73dfff,
      emissive:0x164e65,
      emissiveIntensity:.8
    });

  for(
    let y=12;
    y<h-8;
    y+=15
  ){

    const win=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          w*.62,
          4,
          .35
        ),
        windows
      );

    win.position.set(
      x,
      y,
      z-d/2-.2
    );

    scene.add(win);
  }
}

/* ================= SPECIAL BUILDING ================= */

function makeSpecial(
  x,z,w,h,d,color,name
){

  const building=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,h,d
      ),
      new THREE.MeshStandardMaterial({
        color,
        metalness:.3,
        roughness:.35
      })
    );

  building.position.set(
    x,h/2,z
  );

  building.castShadow=true;

  scene.add(building);

  const label=
    makeLabel(name);

  label.position.set(
    x,
    h+12,
    z
  );

  scene.add(label);
}

/* ================= LABEL ================= */

function makeLabel(text){

  const c=
    document.createElement(
      "canvas"
    );

  c.width=512;
  c.height=128;

  const ctx=
    c.getContext("2d");

  ctx.fillStyle="#55d6ff";

  ctx.font=
    "bold 52px Arial";

  ctx.textAlign="center";

  ctx.fillText(
    text,
    256,
    75
  );

  const texture=
    new THREE.CanvasTexture(c);

  const sprite=
    new THREE.Sprite(
      new THREE.SpriteMaterial({
        map:texture,
        transparent:true
      })
    );

  sprite.scale.set(
    48,12,1
  );

  return sprite;
}

/* ================= HUMAN ================= */

function createHuman(
  bodyColor
){

  const group=
    new THREE.Group();

  const body=
    new THREE.Mesh(
      new THREE.CapsuleGeometry(
        1.15,2.8,6,12
      ),
      new THREE.MeshStandardMaterial({
        color:bodyColor
      })
    );

  body.position.y=3;

  body.castShadow=true;

  group.add(body);

  const head=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        1.1,16,16
      ),
      new THREE.MeshStandardMaterial({
        color:0xc58b68
      })
    );

  head.position.y=6;

  head.castShadow=true;

  group.add(head);

  /* arms */

  for(
    const side of [-1,1]
  ){

    const arm=
      new THREE.Mesh(
        new THREE.CapsuleGeometry(
          .32,2,5,8
        ),
        new THREE.MeshStandardMaterial({
          color:bodyColor
        })
      );

    arm.position.set(
      side*1.45,
      3.3,
      0
    );

    arm.rotation.z=
      side*.15;

    arm.castShadow=true;

    group.add(arm);
  }

  return group;
}

/* ================= PLAYER ================= */

function createPlayer(){

  player=
    createHuman(0x168dcc);

  player.position.set(
    0,0,80
  );

  scene.add(player);
}

/* ================= NPCS ================= */

function createNPCs(){

  for(
    let i=0;
    i<55;
    i++
  ){

    const npc=
      createHuman(
        Math.random()*0xffffff
      );

    npc.position.set(
      (Math.random()-.5)*1100,
      0,
      (Math.random()-.5)*1100
    );

    npc.userData={
      direction:
        Math.random()*
        Math.PI*2,

      speed:
        .015+
        Math.random()*.035
    };

    scene.add(npc);

    npcs.push(npc);
  }
}

function updateNPCs(){

  for(
    const npc of npcs
  ){

    npc.position.x+=
      Math.sin(
        npc.userData.direction
      )*
      npc.userData.speed;

    npc.position.z+=
      Math.cos(
        npc.userData.direction
      )*
      npc.userData.speed;

    npc.rotation.y=
      npc.userData.direction;

    if(
      Math.abs(
        npc.position.x
      )>680
    ){

      npc.userData.direction+=
        Math.PI;
    }

    if(
      Math.abs(
        npc.position.z
      )>680
    ){

      npc.userData.direction+=
        Math.PI;
    }
  }
}

/* ================= CAR ================= */

function createCar(){

  car=
    new THREE.Group();

  const body=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        7,1.6,13
      ),
      new THREE.MeshStandardMaterial({
        color:0xd4142e,
        metalness:.8,
        roughness:.18
      })
    );

  body.position.y=2;

  body.castShadow=true;

  car.add(body);

  const cabin=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        5.4,2.2,6
      ),
      new THREE.MeshStandardMaterial({
        color:0x0d151b,
        metalness:.5,
        roughness:.1
      })
    );

  cabin.position.y=3.5;

  cabin.castShadow=true;

  car.add(cabin);

  const wheelMaterial=
    new THREE.MeshStandardMaterial({
      color:0x101010
    });

  for(
    const x of [-3.2,3.2]
  ){

    for(
      const z of [-4.2,4.2]
    ){

      const wheel=
        new THREE.Mesh(
          new THREE.CylinderGeometry(
            1.3,1.3,1,18
          ),
          wheelMaterial
        );

      wheel.rotation.z=
        Math.PI/2;

      wheel.position.set(
        x,1.2,z
      );

      wheel.castShadow=true;

      car.add(wheel);
    }
  }

  car.position.set(
    0,0,45
  );

  scene.add(car);
}

/* ================= VEHICLE ================= */

function enterExit(){

  const distance=
    player.position.distanceTo(
      car.position
    );

  if(
    !driving &&
    distance<22
  ){

    driving=true;

    player.visible=false;

    document.getElementById(
      "vehicle"
    ).textContent=
      "X-RACER";

    showMessage(
      "Entered X-Racer 🚗"
    );

  }else if(driving){

    driving=false;

    player.visible=true;

    player.position.set(
      car.position.x+10,
      0,
      car.position.z
    );

    document.getElementById(
      "vehicle"
    ).textContent=
      "On Foot";

    showMessage(
      "Exited vehicle"
    );
  }
}

/* ================= JUMP ================= */

function jump(){

  if(
    !driving &&
    grounded
  ){

    verticalVelocity=
      .42;

    grounded=false;
  }
}

/* ================= MOVEMENT ================= */

function updateMovement(){

  let x=0;
  let z=0;

  if(keys.w)z-=1;
  if(keys.s)z+=1;
  if(keys.a)x-=1;
  if(keys.d)x+=1;

  if(x!==0||z!==0){

    const len=
      Math.hypot(x,z);

    x/=len;
    z/=len;

    let speed=
      keys.shift
      ? .65
      : .35;

    if(driving)
      speed=.9;

    if(driving){

      car.position.x+=
        x*speed;

      car.position.z+=
        z*speed;

      if(x!==0||z!==0){

        car.rotation.y=
          Math.atan2(
            x,z
          );
      }

    }else{

      player.position.x+=
        x*speed;

      player.position.z+=
        z*speed;

      player.rotation.y=
        Math.atan2(
          x,z
        );
    }
  }

  /* gravity */

  if(!driving){

    verticalVelocity-=.018;

    player.position.y+=
      verticalVelocity;

    if(
      player.position.y<=0
    ){

      player.position.y=0;
      verticalVelocity=0;
      grounded=true;
    }
  }
}

/* ================= CAMERA ================= */

let cameraYaw=0;

function updateCamera(){

  const target=
    driving?car:player;

  const distance=
    driving?18:12;

  const height=
    driving?8:7;

  const desired=
    new THREE.Vector3(
      target.position.x+
      Math.sin(cameraYaw)*distance,

      target.position.y+
      height,

      target.position.z+
      Math.cos(cameraYaw)*distance
    );

  camera.position.lerp(
    desired,
    .09
  );

  camera.lookAt(
    target.position.x,
    target.position.y+3,
    target.position.z
  );
}

/* ================= RESET ================= */

function resetGame(){

  driving=false;

  player.visible=true;

  player.position.set(
    0,0,80
  );

  car.position.set(
    0,0,45
  );

  verticalVelocity=0;
  grounded=true;

  document.getElementById(
    "vehicle"
  ).textContent=
    "On Foot";

  saveGame();

  showMessage(
    "Game position reset."
  );
}

/* ================= MESSAGE ================= */

let messageTimer;

function showMessage(text){

  const box=
    document.getElementById(
      "msg"
    );

  box.textContent=text;

  box.style.display="block";

  clearTimeout(
    messageTimer
  );

  messageTimer=
    setTimeout(
      ()=>{
        box.style.display="none";
      },
      2200
    );
}

/* ================= SAVE ================= */

function saveGame(){

  localStorage.setItem(
    "X_CITY_ALPHA2",
    JSON.stringify({
      x:player.position.x,
      y:player.position.y,
      z:player.position.z
    })
  );
}

function loadGame(){

  const saved=
    localStorage.getItem(
      "X_CITY_ALPHA2"
    );

  if(!saved)return;

  try{

    const data=
      JSON.parse(saved);

    player.position.set(
      data.x||0,
      data.y||0,
      data.z||80
    );

  }catch(e){}
}

/* ================= KEYBOARD ================= */

addEventListener(
  "keydown",
  e=>{

    const k=
      e.key.toLowerCase();

    if(k in keys)
      keys[k]=true;

    if(k===" ")
      jump();

    if(k==="e")
      enterExit();

    if(k==="r")
      resetGame();

  }
);

addEventListener(
  "keyup",
  e=>{

    const k=
      e.key.toLowerCase();

    if(k in keys)
      keys[k]=false;
  }
);

/* ================= MOBILE ================= */

document
.querySelectorAll(".key")
.forEach(button=>{

  const key=
    button.dataset.key;

  function press(e){
    e.preventDefault();
    keys[key]=true;
  }

  function release(e){
    e.preventDefault();
    keys[key]=false;
  }

  button.addEventListener(
    "touchstart",
    press,
    {passive:false}
  );

  button.addEventListener(
    "touchend",
    release,
    {passive:false}
  );

});

/* ================= RESIZE ================= */

function resize(){

  if(!camera||!renderer)return;

  camera.aspect=
    innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );
}

/* ================= LOOP ================= */

function animate(){

  requestAnimationFrame(
    animate
  );

  if(!started)return;

  updateMovement();
  updateNPCs();
  updateCamera();

  renderer.render(
    scene,
    camera
  );
}

</script>
</body>
</html>
