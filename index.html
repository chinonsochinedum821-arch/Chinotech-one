<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220"><title>CHINOTECH1 Marketplace</title>
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css">
</head><body>
<header class="top"><div class="brand">CHINOTECH1 <span>Marketplace</span></div><button id="sellTop" class="primary">＋ Sell</button></header>
<main>
<section class="hero"><h1>Buy & sell vehicles with ease.</h1><p>Cars, bikes, trucks and parts in one marketplace.</p><input id="search" class="search" placeholder="Search Toyota, Honda, bike, parts..."></section>
<div class="chips"><button class="chip active" data-cat="All">All</button><button class="chip" data-cat="Cars">Cars</button><button class="chip" data-cat="Bikes">Bikes</button><button class="chip" data-cat="Trucks">Trucks</button><button class="chip" data-cat="Parts">Parts</button></div>
<section><div class="section-head"><h2>Latest listings</h2><span id="count"></span></div><div id="listings" class="grid"></div></section>
</main>
<nav class="bottom"><button class="nav active">⌂<small>Home</small></button><button class="nav" id="favorites">♡<small>Favorites</small></button><button class="nav" id="sellBottom">＋<small>Sell</small></button><button class="nav" id="account">♙<small>Account</small></button></nav>

<div id="modal" class="modal hidden"><div class="sheet"><button class="close" id="close">×</button><h2>Sell an item</h2>
<form id="sellForm">
<input id="title" required placeholder="Vehicle/item name">
<select id="category"><option>Cars</option><option>Bikes</option><option>Trucks</option><option>Parts</option></select>
<input id="price" required type="number" min="1" placeholder="Price (₦)">
<input id="location" required placeholder="Location">
<input id="sellerPhone" required type="tel" placeholder="Seller WhatsApp/phone">
<textarea id="description" placeholder="Short description"></textarea>
<label class="upload">📷 Add photos <input id="photos" type="file" accept="image/*" multiple></label>
<div id="preview" class="preview"></div>
<button class="primary full">Publish listing</button></form></div></div>

<div id="detail" class="modal hidden"><div class="sheet"><button class="close" id="detailClose">×</button><div id="detailBody"></div></div></div>
<div id="accountModal" class="modal hidden"><div class="sheet"><button class="close" id="accountClose">×</button><h2>My Account</h2>
<form id="accountForm"><input id="name" placeholder="Your name" required><input id="phone" placeholder="Phone / WhatsApp" required><input id="email" type="email" placeholder="Email"><button class="primary full">Save profile</button></form><p id="profileMsg"></p></div></div>
<script src="app.js"></script></body></html>
