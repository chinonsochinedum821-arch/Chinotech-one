<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CHINOTECH1: X-CITY</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05090d;font-family:Arial,sans-serif}
canvas{display:block}

#cover{
 position:fixed;inset:0;z-index:999;
 display:flex;flex-direction:column;
 align-items:center;justify-content:center;
 text-align:center;color:white;
 background:
 radial-gradient(circle at 50% 35%,#17617c 0%,#06131b 42%,#020507 100%);
}
#cover:after{
 content:"";
 position:absolute;inset:0;
 background:linear-gradient(transparent 70%,#000);
 pointer-events:none;
}
.brand{color:#55d6ff;font-weight:900;letter-spacing:8px;font-size:15px}
.title{font-size:clamp(55px,14vw,130px);font-weight:1000;letter-spacing:5px;margin:5px}
.title span{color:#55d6ff}
.subtitle{letter-spacing:5px;color:#b9d7df}
.start{
 margin-top:30px;padding:16px 34px;
 border:1px solid #8eeaff;border-radius:14px;
 background:#55d6ff;color:#041018;
 font-weight:900;font-size:17px;
 box-shadow:0 0 30px #55d6ff55;
}

#hud,#mission{
 position:fixed;z-index:30;
 color:#fff;background:#000c;
 border:1px solid #ffffff22;
 border-radius:12px;padding:11px;
 font-size:12px;line-height:1.65;
 backdrop-filter:blur(5px);
}
#hud{top:10px;left:10px}
#mission{top:10px;right:10px;width:210px}
.logo{font-weight:900;color:#55d6ff;letter-spacing:3px}

#notice{
 position:fixed;z-index:50;top:22%;left:50%;
 transform:translateX(-50%);
 display:none;color:white;background:#000e;
 border:1px solid #55d6ff55;border-radius:12px;
 padding:13px 20px;font-weight:bold;
}

#map{
 position:fixed;z-index:30;right:10px;bottom:10px;
 width:145px;height:145px;
 border:2px solid #55d6ff;border-radius:12px;
 background:#071017;
}

#mobile{
 position:fixed;z-index:40;left:12px;right:12px;
 bottom:12px;display:flex;
 justify-content:space-between;pointer-events:none;
}
.pad{width:155px;height:155px;position:relative;pointer-events:auto}
.key{
 position:absolute;width:52px;height:52px;border-radius:50%;
 display:grid;place-items:center;color:#fff;
 background:#ffffff22;border:1px solid #ffffff44;
 font-size:20px;user-select:none;
}
.u{top:0;left:51px}.d{bottom:0;left:51px}
.l{left:0;top:51px}.r{right:0;top:51px}
.actions{display:flex;gap:8px;align-items:end;pointer-events:auto}
.action{
 width:58px;height:58px;border-radius:50%;
 border:1px solid #55d6ff66;
 background:#55d6ff22;color:#fff;font-weight:bold;
}

@media(max-width:600px){
 #mission{width:175px}
 #map{width:120px;height:120px}
 #hud{font-size:10px}
}
</style>
</head>

<body>

<!-- ================= COVER ================= -->

<div id="cover">
 <div class="brand">CHINOTECH1</div>
 <div class="title">X-<span>CITY</span></div>
 <div class="subtitle">OPEN WORLD • ALPHA 1–5</div>
 <button class="start" onclick="startGame()">▶ START X-CITY</button>
</div>

<!-- ================= HUD ================= -->

<div id="hud">
 <div class="logo">CHINOTECH1: X-CITY</div>
 ❤️ Health: <b id="health">100</b><br>
 💰 Cash: ₦<b id="cash">10000</b><br>
 🚘 Vehicle: <b id="vehicle">ON FOOT</b><br>
 🕐 Time: <b id="time">12:00</b><br>
 🌤️ Weather: <b id="weather">CLEAR</b><br>
 🎮 WASD / Touch = Move<br>
 SHIFT = Run • SPACE = Jump<br>
 E = Enter/Exit • M = Mission
</div>

<!-- ================= MISSION ================= -->

<div id="mission">
 <div class="logo">ACTIVE MISSION</div>
 <b id="missionTitle">THE FIRST RUN</b>
 <div id="missionText">Reach X-Mall.</div>
 <br>
 Reward: ₦<span id="reward">5000</span>
</div>

<div id="notice"></div>

<!-- ================= MAP ================= -->

<canvas id="map" width="290" height="290"></canvas>

<!-- ================= MOBILE ================= -->

<div id="mobile">

 <div class="pad">
  <div class="key u" data-key="w">▲</div>
  <div class="key d" data-key="s">▼</div>
  <div class="key l" data-key="a">◀</div>
  <div class="key r" data-key="d">▶</div>
 </div>

 <div class="actions">
  <button class="action" onclick="jump()">⬆</button>
  <button class="action" onclick="interact()">E</button>
  <button class="action" onclick="changeWeather()">☁</button>
  <button class="action" onclick="resetGame()">↻</button>
 </div>

</div>

<!-- ================= 3D ENGINE ================= -->

<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>

<script>

/* =========================================================
   CHINOTECH1: X-CITY
   COMBINED ALPHA 1–5
   ORIGINAL PROCEDURAL GAME PROTOTYPE
   ========================================================= */

let scene,camera,renderer;
let player;
let activeVehicle=null;
let driving=false;
let started=false;

let grounded=true;
let velocityY=0;

let cash=10000;
let health=100;

let gameTime=12;
let weatherIndex=0;

let missionIndex=0;

const keys={
 w:false,a:false,s:false,d:false,shift:false
};

const vehicles=[];
const traffic=[];
const npcs=[];
const buildings=[];

const clock=new THREE.Clock();


/* =========================================================
   START
   ========================================================= */

function startGame(){

 document.getElementById("cover").style.display="none";

 started=true;

 initialize();

}


/* =========================================================
   INITIALIZE
   ========================================================= */

function initialize(){

 scene=new THREE.Scene();

 scene.background=new THREE.Color(0x86c8e5);

 scene.fog=new THREE.Fog(
  0x86c8e5,
  130,
  1200
 );


 camera=new THREE.PerspectiveCamera(
  65,
  innerWidth/innerHeight,
  .1,
  2000
 );


 renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
 });

 renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
 );

 renderer.setSize(
  innerWidth,
  innerHeight
 );

 renderer.shadowMap.enabled=true;

 document.body.appendChild(
  renderer.domElement
 );


 /* LIGHTING */

 scene.add(
  new THREE.HemisphereLight(
   0xbceaff,
   0x304030,
   2
  )
 );


 const sun=new THREE.DirectionalLight(
  0xffffff,
  3
 );

 sun.position.set(
  300,500,250
 );

 sun.castShadow=true;

 sun.shadow.mapSize.width=2048;
 sun.shadow.mapSize.height=2048;

 scene.add(sun);

 window.sun=sun;


 createWorld();
 createPlayer();

 createCar(
  0xd71932,
  0,0,55,
  "X-RACER",
  1
 );

 createCar(
  0x1265d1,
  40,0,55,
  "X-SPORT",
  .9
 );

 createMotorcycle(
  -35,0,55
 );

 createTraffic();
 createNPCs();

 loadGame();

 addEventListener("resize",resize);

 animate();

}


/* =========================================================
   WORLD
   ========================================================= */

function createWorld(){

 const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(1800,1800),
  new THREE.MeshStandardMaterial({
   color:0x365b40
  })
 );

 ground.rotation.x=-Math.PI/2;
 ground.receiveShadow=true;

 scene.add(ground);


 /* MAIN ROADS */

 for(let p=-700;p<=700;p+=100){

  createRoad(
   p,0,36,1500
  );

  createRoad(
   0,p,1500,36
  );

 }


 /* BUILDINGS */

 for(let x=-650;x<=650;x+=100){

  for(let z=-650;z<=650;z+=100){

   if(Math.random()<.13)continue;

   createBuilding(
    x+25,
    z+25,
    55+Math.random()*20,
    18+Math.random()*100,
    55+Math.random()*20
   );

  }

 }


 /* LANDMARKS */

 createLandmark(
  -300,-300,
  105,125,105,
  0x182f3c,
  "X-HOTEL"
 );

 createLandmark(
  300,-300,
  105,90,105,
  0x29383e,
  "X-BANK"
 );

 createLandmark(
  300,300,
  135,60,105,
  0x123f4c,
  "X-MALL"
 );

 createLandmark(
  -300,300,
  110,48,105,
  0x343b42,
  "X-GARAGE"
 );

 createLandmark(
  0,300,
  100,45,95,
  0x573a24,
  "X-DEALER"
 );

 createLandmark(
  0,-300,
  110,65,100,
  0x253d55,
  "X-AIRPORT"
 );

}


/* =========================================================
   ROADS
   ========================================================= */

function createRoad(x,z,w,d){

 const road=new THREE.Mesh(
  new THREE.BoxGeometry(w,.08,d),
  new THREE.MeshStandardMaterial({
   color:0x292d31
  })
 );

 road.position.set(x,.04,z);

 scene.add(road);


 /* ROAD LINE */

 const line=new THREE.Mesh(
  new THREE.BoxGeometry(
   w>.1?2:w,
   .09,
   d>.1?2:d
  ),
  new THREE.MeshStandardMaterial({
   color:0xf0d34b
  })
 );

 line.position.set(x,.09,z);

 scene.add(line);

}


/* =========================================================
   BUILDINGS
   ========================================================= */

function createBuilding(x,z,w,h,d){

 const palette=[
  0x33434d,
  0x455a64,
  0x263238,
  0x37474f,
  0x50646e,
  0x283b45
 ];

 const building=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({
   color:
    palette[
     Math.floor(
      Math.random()*palette.length
     )
    ],
   roughness:.75
  })
 );

 building.position.set(
  x,h/2,z
 );

 building.castShadow=true;
 building.receiveShadow=true;

 scene.add(building);

 buildings.push(building);


 /* WINDOWS */

 const windowMat=
  new THREE.MeshStandardMaterial({
   color:0x75dfff,
   emissive:0x154c62,
   emissiveIntensity:.6
  });


 for(let y=12;y<h;y+=15){

  const windowStrip=new THREE.Mesh(
   new THREE.BoxGeometry(
    w*.62,
    3.5,
    .25
   ),
   windowMat
  );

  windowStrip.position.set(
   x,
   y,
   z-d/2-.2
  );

  scene.add(windowStrip);

 }

}


/* =========================================================
   LANDMARKS
   ========================================================= */

function createLandmark(
 x,z,w,h,d,color,name
){

 const building=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({
   color,
   metalness:.2,
   roughness:.45
  })
 );

 building.position.set(
  x,h/2,z
 );

 building.castShadow=true;

 scene.add(building);


 const label=makeLabel(name);

 label.position.set(
  x,h+12,z
 );

 scene.add(label);

}


/* =========================================================
   LABEL
   ========================================================= */

function makeLabel(text){

 const canvas=
  document.createElement("canvas");

 canvas.width=700;
 canvas.height=150;

 const ctx=canvas.getContext("2d");

 ctx.fillStyle="#55d6ff";

 ctx.font="bold 60px Arial";

 ctx.textAlign="center";

 ctx.fillText(
  text,
  350,
  95
 );

 const texture=
  new THREE.CanvasTexture(canvas);

 const sprite=
  new THREE.Sprite(
   new THREE.SpriteMaterial({
    map:texture,
    transparent:true
   })
  );

 sprite.scale.set(
  55,12,1
 );

 return sprite;

}


/* =========================================================
   HUMAN
   ========================================================= */

function makeHuman(color){

 const group=new THREE.Group();


 const body=new THREE.Mesh(
  new THREE.CapsuleGeometry(
   1.1,2.7,6,12
  ),
  new THREE.MeshStandardMaterial({
   color
  })
 );

 body.position.y=3;
 body.castShadow=true;

 group.add(body);


 const head=new THREE.Mesh(
  new THREE.SphereGeometry(
   1.05,16,16
  ),
  new THREE.MeshStandardMaterial({
   color:0xc58b68
  })
 );

 head.position.y=6;

 head.castShadow=true;

 group.add(head);


 /* ARMS */

 for(const side of [-1,1]){

  const arm=new THREE.Mesh(
   new THREE.CapsuleGeometry(
    .3,2,5,8
   ),
   new THREE.MeshStandardMaterial({
    color
   })
  );

  arm.position.set(
   side*1.4,
   3.2,
   0
  );

  group.add(arm);

 }


 /* LEGS */

 for(const side of [-1,1]){

  const leg=new THREE.Mesh(
   new THREE.CapsuleGeometry(
    .38,2.2,5,8
   ),
   new THREE.MeshStandardMaterial({
    color:0x17202a
   })
  );

  leg.position.set(
   side*.55,
   1,
   0
  );

  group.add(leg);

 }


 return group;

}


/* =========================================================
   PLAYER
   ========================================================= */

function createPlayer(){

 player=makeHuman(
  0x168dcc
 );

 player.position.set(
  0,0,80
 );

 scene.add(player);

}


/* =========================================================
   NPC
   ========================================================= */

function createNPCs(){

 for(let i=0;i<65;i++){

  const npc=makeHuman(
   Math.random()*0xffffff
  );

  npc.position.set(
   (Math.random()-.5)*1250,
   0,
   (Math.random()-.5)*1250
  );

  npc.userData={
   direction:Math.random()*Math.PI*2,
   speed:.015+Math.random()*.04,
   timer:0
  };

  scene.add(npc);

  npcs.push(npc);

 }

}


function updateNPCs(){

 for(const npc of npcs){

  npc.userData.timer+=.01;

  if(npc.userData.timer>5){

   npc.userData.timer=0;

   npc.userData.direction+=
    (Math.random()-.5)*2;

  }

  npc.position.x+=
   Math.sin(npc.userData.direction)*
   npc.userData.speed;

  npc.position.z+=
   Math.cos(npc.userData.direction)*
   npc.userData.speed;

  npc.rotation.y=
   npc.userData.direction;

 }

}


/* =========================================================
   CAR
   ========================================================= */

function createCar(
 color,x,y,z,name,speed
){

 const car=new THREE.Group();


 const body=new THREE.Mesh(
  new THREE.BoxGeometry(
   7,1.6,13
  ),
  new THREE.MeshStandardMaterial({
   color,
   metalness:.8,
   roughness:.18
  })
 );

 body.position.y=2;
 body.castShadow=true;

 car.add(body);


 const cabin=new THREE.Mesh(
  new THREE.BoxGeometry(
   5.3,2.2,6
  ),
  new THREE.MeshStandardMaterial({
   color:0x0b1218,
   metalness:.4,
   roughness:.12
  })
 );

 cabin.position.y=3.5;

 car.add(cabin);


 /* WHEELS */

 for(const sx of [-3.2,3.2]){

  for(const sz of [-4.2,4.2]){

   const wheel=new THREE.Mesh(
    new THREE.CylinderGeometry(
     1.3,1.3,1,18
    ),
    new THREE.MeshStandardMaterial({
     color:0x090909
    })
   );

   wheel.rotation.z=Math.PI/2;

   wheel.position.set(
    sx,1.2,sz
   );

   car.add(wheel);

  }

 }


 /* HEADLIGHTS */

 for(const sx of [-2.1,2.1]){

  const light=new THREE.Mesh(
   new THREE.BoxGeometry(
    1.2,.4,.2
   ),
   new THREE.MeshStandardMaterial({
    color:0xffffff,
    emissive:0xffffff,
    emissiveIntensity:2
   })
  );

  light.position.set(
   sx,2.3,6.55
  );

  car.add(light);

 }


 car.position.set(x,y,z);

 car.userData={
  type:"car",
  name,
  speed,
  traffic:false
 };

 scene.add(car);

 vehicles.push(car);

 return car;

}


/* =========================================================
   MOTORCYCLE
   ========================================================= */

function createMotorcycle(x,y,z){

 const bike=new THREE.Group();


 const frame=new THREE.Mesh(
  new THREE.BoxGeometry(
   1.2,1,4
  ),
  new THREE.MeshStandardMaterial({
   color:0x15191d,
   metalness:.8
  })
 );

 frame.position.y=1.6;

 bike.add(frame);


 for(const zz of [-1.6,1.6]){

  const wheel=new THREE.Mesh(
   new THREE.CylinderGeometry(
    .65,.65,.35,18
   ),
   new THREE.MeshStandardMaterial({
    color:0x070707
   })
  );

  wheel.rotation.z=Math.PI/2;

  wheel.position.set(
   0,.8,zz
  );

  bike.add(wheel);

 }


 const seat=new THREE.Mesh(
  new THREE.BoxGeometry(
   1.4,.4,1.5
  ),
  new THREE.MeshStandardMaterial({
   color:0x202020
  })
 );

 seat.position.set(
  0,2.2,-.3
 );

 bike.add(seat);


 bike.position.set(
  x,y,z
 );

 bike.userData={
  type:"bike",
  name:"X-BIKE",
  speed:1.15,
  traffic:false
 };

 scene.add(bike);

 vehicles.push(bike);

}


/* =========================================================
   TRAFFIC
   ========================================================= */

function createTraffic(){

 const colors=[
  0x2266cc,
  0xf0c419,
  0xeeeeee,
  0x202020,
  0x20a060,
  0xc63dff
 ];

 for(let i=0;i<18;i++){

  const v=createCar(
   colors[i%colors.length],
   -700+i*80,
   0,
   100,
   "TRAFFIC",
   .15+Math.random()*.3
  );

  v.userData.traffic=true;

  traffic.push(v);

 }

}


function updateTraffic(){

 for(const v of traffic){

  v.position.x+=
   v.userData.speed;

  if(v.position.x>750)
   v.position.x=-750;

 }

}


/* =========================================================
   INTERACTION
   ========================================================= */

function interact(){

 if(driving){

  driving=false;

  player.visible=true;

  player.position.set(
   activeVehicle.position.x+10,
   0,
   activeVehicle.position.z
  );

  activeVehicle=null;

  document.getElementById(
   "vehicle"
  ).textContent="ON FOOT";

  notify("Exited vehicle");

  return;

 }


 let nearest=null;
 let nearestDistance=999;


 for(const v of vehicles){

  const distance=
   player.position.distanceTo(
    v.position
   );

  if(distance<nearestDistance){

   nearestDistance=distance;
   nearest=v;

  }

 }


 if(nearest&&nearestDistance<20){

  driving=true;

  activeVehicle=nearest;

  player.visible=false;

  document.getElementById(
   "vehicle"
  ).textContent=
   nearest.userData.name;

  notify(
   "Entered "+nearest.userData.name
  );

  return;

 }


 /* BANK */

 if(distanceTo(300,-300)<90){

  cash+=500;

  notify(
   "X-BANK: ₦500 credited"
  );

  updateHUD();

 }


 /* MALL */

 if(distanceTo(300,300)<110){

  if(cash>=1000){

   cash-=1000;

   notify(
    "X-MALL purchase: ₦1,000"
   );

   updateHUD();

  }else{

   notify(
    "You need ₦1,000"
   );

  }

 }


 /* GARAGE */

 if(distanceTo(-300,300)<100){

  health=100;

  notify(
   "Garage service complete"
  );

  updateHUD();

 }

}


/* =========================================================
   DISTANCE
   ========================================================= */

function distanceTo(x,z){

 return Math.hypot(
  player.position.x-x,
  player.position.z-z
 );

}


/* =========================================================
   JUMP
   ========================================================= */

function jump(){

 if(!driving&&grounded){

  velocityY=.45;
  grounded=false;

 }

}


/* =========================================================
   MOVEMENT
   ========================================================= */

function updateMovement(){

 let x=0,z=0;

 if(keys.w)z--;
 if(keys.s)z++;
 if(keys.a)x--;
 if(keys.d)x++;


 if(x||z){

  const length=
   Math.hypot(x,z);

  x/=length;
  z/=length;


  let speed=
   keys.shift
   ? .65
   : .35;


  if(driving){

   speed=
    activeVehicle.userData.speed;

   activeVehicle.position.x+=
    x*speed;

   activeVehicle.position.z+=
    z*speed;

   activeVehicle.rotation.y=
    Math.atan2(x,z);

  }else{

   player.position.x+=
    x*speed;

   player.position.z+=
    z*speed;

   player.rotation.y=
    Math.atan2(x,z);

  }

 }


 if(!driving){

  velocityY-=.018;

  player.position.y+=
   velocityY;


  if(player.position.y<=0){

   player.position.y=0;
   velocityY=0;
   grounded=true;

  }

 }

}


/* =========================================================
   CAMERA
   ========================================================= */

function updateCamera(){

 const target=
  driving
  ?activeVehicle
  :player;


 const distance=
  driving?20:14;


 const height=
  driving?9:8;


 const desired=new THREE.Vector3(
  target.position.x,
  target.position.y+height,
  target.position.z+distance
 );


 camera.position.lerp(
  desired,
  .08
 );


 camera.lookAt(
  target.position.x,
  target.position.y+2.5,
  target.position.z
 );

}


/* =========================================================
   MISSION SYSTEM
   ========================================================= */

const missions=[

 {
  title:"THE FIRST RUN",
  text:"Reach X-Mall.",
  x:300,
  z:300,
  reward:5000
 },

 {
  title:"BANK RUN",
  text:"Visit X-Bank.",
  x:300,
  z:-300,
  reward:7000
 },

 {
  title:"GARAGE CALL",
  text:"Visit X-Garage.",
  x:-300,
  z:300,
  reward:8500
 },

 {
  title:"HOTEL CHECK",
  text:"Reach X-Hotel.",
  x:-300,
  z:-300,
  reward:10000
 },

 {
  title:"FINAL RUN",
  text:"Reach X-Dealer.",
  x:0,
  z:300,
  reward:15000
 }

];


function updateMission(){

 if(missionIndex>=missions.length)
  return;


 const m=
  missions[missionIndex];


 const target=
  driving
  ?activeVehicle.position
  :player.position;


 if(Math.hypot(
  target.x-m.x,
  target.z-m.z
 )<100){

  cash+=m.reward;

  notify(
   "MISSION COMPLETE! +₦"+
   m.reward.toLocaleString()
  );

  missionIndex++;

  updateMissionUI();
  updateHUD();

 }

}


function updateMissionUI(){

 if(missionIndex>=missions.length){

  document.getElementById(
   "missionTitle"
  ).textContent=
   "ALL MISSIONS COMPLETE";

  document.getElementById(
   "missionText"
  ).textContent=
   "X-CITY LEGEND";

  document.getElementById(
   "reward"
  ).textContent="0";

  return;

 }


 const m=
  missions[missionIndex];


 document.getElementById(
  "missionTitle"
 ).textContent=m.title;


 document.getElementById(
  "missionText"
 ).textContent=m.text;


 document.getElementById(
  "reward"
 ).textContent=
  m.reward.toLocaleString();

}


/* =========================================================
   DAY / NIGHT
   ========================================================= */

function updateTime(dt){

 gameTime+=dt*.45;

 if(gameTime>=24)
  gameTime=0;


 const hour=Math.floor(gameTime);

 const minute=
  Math.floor(
   (gameTime-hour)*60
  );


 document.getElementById(
  "time"
 ).textContent=
  String(hour).padStart(2,"0")+
  ":"+
  String(minute).padStart(2,"0");


 const night=
  hour<6||hour>=19;


 if(night){

  scene.background=
   new THREE.Color(0x06101e);

  scene.fog.color=
   new THREE.Color(0x06101e);

  window.sun.intensity=.35;

 }else{

  scene.background=
   new THREE.Color(0x86c8e5);

  scene.fog.color=
   new THREE.Color(0x86c8e5);

  window.sun.intensity=3;

 }

}


/* =========================================================
   WEATHER
   ========================================================= */

const weatherNames=[
 "CLEAR",
 "RAIN",
 "FOG"
];


function changeWeather(){

 weatherIndex++;

 if(weatherIndex>=
    weatherNames.length)
  weatherIndex=0;


 const name=
  weatherNames[weatherIndex];


 document.getElementById(
  "weather"
 ).textContent=name;


 if(name==="CLEAR"){

  scene.fog.near=130;
  scene.fog.far=1200;

 }else if(name==="RAIN"){

  scene.fog.near=70;
  scene.fog.far=700;

 }else{

  scene.fog.near=30;
  scene.fog.far=300;

 }


 notify(
  "Weather: "+name
 );

}


/* =========================================================
   HUD
   ========================================================= */

function updateHUD(){

 document.getElementById(
  "health"
 ).textContent=health;


 document.getElementById(
  "cash"
 ).textContent=
  cash.toLocaleString();

}


/* =========================================================
   SAVE
   ========================================================= */

function saveGame(){

 if(!player)return;

 localStorage.setItem(
  "CHINOTECH1_XCITY",
  JSON.stringify({

   x:player.position.x,
   y:player.position.y,
   z:player.position.z,

   cash,
   health,

   gameTime,

   missionIndex

  })
 );

}


/* =========================================================
   LOAD
   ========================================================= */

function loadGame(){

 const saved=
  localStorage.getItem(
   "CHINOTECH1_XCITY"
  );


 if(!saved)return;


 try{

  const data=
   JSON.parse(saved);


  player.position.set(
   data.x||0,
   data.y||0,
   data.z||80
  );


  cash=
   data.cash??10000;


  health=
   data.health??100;


  gameTime=
   data.gameTime??12;


  missionIndex=
   data.missionIndex??0;


  updateHUD();
  updateMissionUI();

 }catch(error){

  console.log(
   "Save data unavailable"
  );

 }

}


/* =========================================================
   RESET
   ========================================================= */

function resetGame(){

 driving=false;

 activeVehicle=null;

 player.visible=true;

 player.position.set(
  0,0,80
 );

 velocityY=0;
 grounded=true;

 cash=10000;
 health=100;

 gameTime=12;
 missionIndex=0;

 document.getElementById(
  "vehicle"
 ).textContent="ON FOOT";

 updateHUD();
 updateMissionUI();

 saveGame();

 notify(
  "X-CITY reset"
 );

}


/* =========================================================
   NOTIFICATION
   ========================================================= */

let noticeTimer;


function notify(text){

 const box=
  document.getElementById(
   "notice"
  );


 box.textContent=text;

 box.style.display="block";


 clearTimeout(
  noticeTimer
 );


 noticeTimer=
  setTimeout(
   ()=>{
    box.style.display="none";
   },
   2300
  );

}


/* =========================================================
   MAP
   ========================================================= */

function drawMap(){

 const canvas=
  document.getElementById("map");

 const ctx=
  canvas.getContext("2d");


 ctx.clearRect(
  0,0,
  canvas.width,
  canvas.height
 );


 ctx.fillStyle="#101b20";

 ctx.fillRect(
  0,0,
  canvas.width,
  canvas.height
 );


 ctx.strokeStyle="#263b43";

 ctx.lineWidth=4;


 for(
  let p=0;
  p<=290;
  p+=29
 ){

  ctx.beginPath();
  ctx.moveTo(p,0);
  ctx.lineTo(p,290);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(0,p);
  ctx.lineTo(290,p);
  ctx.stroke();

 }


 /* PLAYER */

 const px=
  ((player.position.x+750)/1500)*290;

 const pz=
  ((player.position.z+750)/1500)*290;


 ctx.fillStyle="#55d6ff";

 ctx.beginPath();

 ctx.arc(
  px,pz,
  7,0,Math.PI*2
 );

 ctx.fill();


 /* MISSION */

 if(missionIndex<missions.length){

  const m=
   missions[missionIndex];

  const mx=
   ((m.x+750)/1500)*290;

  const mz=
   ((m.z+750)/1500)*290;


  ctx.fillStyle="#ffd43b";

  ctx.beginPath();

  ctx.arc(
   mx,mz,
   6,0,Math.PI*2
  );

  ctx.fill();

 }

}


/* =========================================================
   KEYBOARD
   ========================================================= */

addEventListener(
 "keydown",
 e=>{

  const k=
   e.key.toLowerCase();


  if(k in keys)
   keys[k]=true;


  if(k===" ")
   jump();


  if(k==="e")
   interact();


  if(k==="r")
   resetGame();


  if(k==="m")
   notify(
    missions[missionIndex]
    ?missions[missionIndex].text
    :"All missions complete"
   );

 }
);


addEventListener(
 "keyup",
 e=>{

  const k=
   e.key.toLowerCase();


  if(k in keys)
   keys[k]=false;

 }
);


/* =========================================================
   TOUCH CONTROLS
   ========================================================= */

document
.querySelectorAll(".key")
.forEach(button=>{

 const key=
  button.dataset.key;


 button.addEventListener(
  "touchstart",
  e=>{
   e.preventDefault();
   keys[key]=true;
  },
  {passive:false}
 );


 button.addEventListener(
  "touchend",
  e=>{
   e.preventDefault();
   keys[key]=false;
  },
  {passive:false}
 );

});


/* =========================================================
   RESIZE
   ========================================================= */

function resize(){

 if(!camera)return;

 camera.aspect=
  innerWidth/innerHeight;

 camera.updateProjectionMatrix();

 renderer.setSize(
  innerWidth,
  innerHeight
 );

}


/* =========================================================
   MAIN GAME LOOP
   ========================================================= */

function animate(){

 requestAnimationFrame(
  animate
 );


 if(!started)return;


 const dt=
  clock.getDelta();


 updateMovement();

 updateNPCs();

 updateTraffic();

 updateMission();

 updateTime(dt);

 updateCamera();

 drawMap();


 /* AUTOSAVE */

 if(Math.random()<.01)
  saveGame();


 renderer.render(
  scene,
  camera
 );

}

</script>

</body>
</html>
