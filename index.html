<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHINOTECH ONE MARKETPLACE</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f5f7;
  color:#111827;
}
header{
  background:#111827;
  color:white;
  padding:14px;
  position:sticky;
  top:0;
  z-index:10;
}
.header{
  max-width:1200px;
  margin:auto;
}
.logo{
  font-size:24px;
  font-weight:900;
  margin-bottom:12px;
}
.search{
  display:flex;
  gap:5px;
}
.search input{
  flex:1;
  padding:14px;
  border:0;
  border-radius:8px;
  font-size:16px;
}
.search button{
  border:0;
  background:#ff5a1f;
  color:white;
  padding:0 18px;
  border-radius:8px;
  font-weight:bold;
}
.categories{
  max-width:1200px;
  margin:15px auto;
  padding:0 14px;
  display:flex;
  gap:8px;
  overflow-x:auto;
}
.categories button{
  white-space:nowrap;
  border:0;
  padding:10px 15px;
  border-radius:20px;
  background:white;
  cursor:pointer;
}
.categories button.active{
  background:#111827;
  color:white;
}
.hero{
  max-width:1200px;
  margin:15px auto;
  padding:30px 18px;
  border-radius:18px;
  color:white;
  background:linear-gradient(120deg,#111827,#374151);
}
.hero h1{
  margin:0 0 8px;
}
.hero p{
  margin:0;
  color:#d1d5db;
}
.grid{
  max-width:1200px;
  margin:auto;
  padding:0 14px 30px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:15px;
}
.card{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 3px 12px #0001;
}
.card img{
  width:100%;
  height:180px;
  object-fit:cover;
  background:#eee;
}
.info{
  padding:12px;
}
.category{
  font-size:12px;
  color:#777;
}
.name{
  font-weight:bold;
  margin:5px 0;
}
.price{
  font-size:18px;
  font-weight:900;
  margin:8px 0;
}
.buttons{
  display:flex;
  gap:7px;
}
.buy,.payment{
  flex:1;
  border:0;
  padding:10px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}
.buy{
  background:#111827;
  color:white;
}
.payment{
  background:#ff5a1f;
  color:white;
}
.empty{
  text-align:center;
  padding:50px;
  color:#777;
}
footer{
  background:#111827;
  color:white;
  padding:25px;
  text-align:center;
}

@media(max-width:500px){
  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }
  .card img{
    height:140px;
  }
  .name{
    font-size:14px;
  }
  .price{
    font-size:15px;
  }
  .buy,.payment{
    font-size:11px;
    padding:9px 4px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header">
    <div class="logo">CHINOTECH1 MARKETPLACE</div>

    <div class="search">
      <input
        id="searchBox"
        type="search"
        placeholder="Search cars, phones, laptops, clothes..."
      >
      <button onclick="searchProducts()">Search</button>
    </div>
  </div>
</header>

<div class="categories" id="categories"></div>

<section class="hero">
  <h1>Welcome to CHINOTECH ONE</h1>
  <p>
    Cars • Phones • Laptops • Electronics • Home • Fashion • Beauty • Watches • Drones
  </p>
</section>

<section class="grid" id="productGrid"></section>

<div class="empty" id="empty" style="display:none">
  No products found.
</div>

<footer>
  © 2026 CHINOTECH ONE MARKETPLACE
</footer>

<script>

/* YOUR PAYSTACK PAYMENT PAGE */
const PAYSTACK_LINK =
"https://paystack.shop/pay/-b57cnxu3v";


/* PRODUCT IMAGE SOURCES */
const images = {
  phone:
  "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=900&q=80",

  laptop:
  "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=900&q=80",

  car:
  "https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=900&q=80",

  home:
  "https://images.unsplash.com/photo-1558008258-3256797b43f3?auto=format&fit=crop&w=900&q=80",

  electronics:
  "https://images.unsplash.com/photo-1498049794561-7780e7231661?auto=format&fit=crop&w=900&q=80",

  watch:
  "https://images.unsplash.com/photo-1524805444758-089113d48a6d?auto=format&fit=crop&w=900&q=80",

  glasses:
  "https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=900&q=80",

  clothes:
  "https://images.unsplash.com/photo-1445205170230-053b83016050?auto=format&fit=crop&w=900&q=80",

  beauty:
  "https://images.unsplash.com/photo-1596462502278-27bfdc403348?auto=format&fit=crop&w=900&q=80",

  shoes:
  "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=900&q=80",

  drone:
  "https://images.unsplash.com/photo-1473968512647-3e447244af8f?auto=format&fit=crop&w=900&q=80"
};


/* MARKETPLACE PRODUCTS */
const products = [

/* CARS */
["Lamborghini Revuelto","Cars","₦950,000,000","car"],
["Lamborghini Huracan","Cars","₦500,000,000","car"],
["Ferrari 296 GTB","Cars","₦720,000,000","car"],
["Ferrari SF90","Cars","₦850,000,000","car"],
["Lexus LX","Cars","₦180,000,000","car"],
["Lexus RX","Cars","₦90,000,000","car"],
["Honda CR-V","Cars","₦75,000,000","car"],
["Honda Accord","Cars","₦65,000,000","car"],
["Toyota Land Cruiser","Cars","₦160,000,000","car"],
["Toyota Camry","Cars","₦65,000,000","car"],

/* PHONES */
["iPhone 13","Phones","₦450,000","phone"],
["iPhone 14","Phones","₦550,000","phone"],
["iPhone 15","Phones","₦700,000","phone"],
["iPhone 16","Phones","₦900,000","phone"],
["iPhone 17","Phones","₦1,100,000","phone"],
["Samsung Galaxy S Series","Phones","₦900,000","phone"],
["Samsung Galaxy A Series","Phones","₦350,000","phone"],
["Google Pixel","Phones","₦800,000","phone"],
["Tecno Phantom","Phones","₦500,000","phone"],
["Tecno Spark","Phones","₦250,000","phone"],
["Infinix Note","Phones","₦300,000","phone"],

/* LAPTOPS */
["MacBook Air","Laptops","₦1,700,000","laptop"],
["MacBook Pro","Laptops","₦2,800,000","laptop"],
["Samsung Galaxy Book","Laptops","₦1,400,000","laptop"],
["HP Laptop","Laptops","₦900,000","laptop"],
["Dell Laptop","Laptops","₦1,000,000","laptop"],
["Lenovo Laptop","Laptops","₦850,000","laptop"],
["ASUS Laptop","Laptops","₦950,000","laptop"],
["Acer Laptop","Laptops","₦800,000","laptop"],

/* HOME */
["Smart TV","Home","₦650,000","home"],
["Refrigerator","Home","₦900,000","home"],
["Air Conditioner","Home","₦800,000","home"],
["Washing Machine","Home","₦700,000","home"],
["Microwave","Home","₦250,000","home"],
["Electric Kettle","Home","₦70,000","home"],
["Blender","Home","₦90,000","home"],
["Electric Cooker","Home","₦250,000","home"],

/* ELECTRONICS */
["Bluetooth Speaker","Electronics","₦120,000","electronics"],
["Headphones","Electronics","₦180,000","electronics"],
["Power Bank","Electronics","₦80,000","electronics"],
["Gaming Console","Electronics","₦900,000","electronics"],
["Keyboard","Electronics","₦70,000","electronics"],
["Computer Mouse","Electronics","₦45,000","electronics"],
["Camera","Electronics","₦800,000","electronics"],
["Projector","Electronics","₦350,000","electronics"],

/* WATCHES */
["Smart Watch","Watches","₦150,000","watch"],
["Luxury Watch","Watches","₦500,000","watch"],
["Fitness Watch","Watches","₦120,000","watch"],

/* FASHION */
["Eyeglasses","Fashion","₦80,000","glasses"],
["Sunglasses","Fashion","₦60,000","glasses"],
["Men Clothes","Fashion","₦50,000","clothes"],
["Women Clothes","Fashion","₦50,000","clothes"],
["Sneakers","Fashion","₦120,000","shoes"],
["Handbag","Fashion","₦150,000","clothes"],

/* BEAUTY */
["Human Hair Wig","Beauty","₦180,000","beauty"],
["Weaveon","Beauty","₦150,000","beauty"],
["Hair Clipper","Beauty","₦75,000","beauty"],
["Hair Dryer","Beauty","₦90,000","beauty"],

/* DRONES */
["Camera Drone","Electronics","₦450,000","drone"],
["Professional Drone","Electronics","₦900,000","drone"]

].map((p,index)=>({
  id:index+1,
  name:p[0],
  category:p[1],
  price:p[2],
  image:images[p[3]]
}));


/* CATEGORIES */
const categories=[
  "All",
  "Cars",
  "Phones",
  "Laptops",
  "Electronics",
  "Home",
  "Fashion",
  "Beauty",
  "Watches"
];

let selectedCategory="All";


/* CREATE CATEGORY BUTTONS */
const categoryBox=document.getElementById("categories");

categories.forEach(category=>{

  const button=document.createElement("button");

  button.textContent=category;

  if(category==="All"){
    button.classList.add("active");
  }

  button.onclick=()=>{

    selectedCategory=category;

    document
      .querySelectorAll(".categories button")
      .forEach(b=>b.classList.remove("active"));

    button.classList.add("active");

    renderProducts();
  };

  categoryBox.appendChild(button);

});


/* DISPLAY PRODUCTS */
function renderProducts(){

  const search=
    document
    .getElementById("searchBox")
    .value
    .toLowerCase()
    .trim();

  const filtered=products.filter(product=>{

    const categoryMatch=
      selectedCategory==="All" ||
      product.category===selectedCategory;

    const searchMatch=
      product.name.toLowerCase().includes(search) ||
      product.category.toLowerCase().includes(search);

    return categoryMatch && searchMatch;

  });


  const grid=document.getElementById("productGrid");

  grid.innerHTML="";


  filtered.forEach(product=>{

    const card=document.createElement("article");

    card.className="card";

    card.innerHTML=`

      <img
        src="${product.image}"
        alt="${product.name}"
        onerror="this.src='${images.electronics}'"
      >

      <div class="info">

        <div class="category">
          ${product.category}
        </div>

        <div class="name">
          ${product.name}
        </div>

        <div class="price">
          ${product.price}
        </div>

        <div class="buttons">

          <button
            class="buy"
            onclick="buyProduct('${product.name}')">
            Buy
          </button>

          <button
            class="payment"
            onclick="payProduct('${product.name}')">
            Payment
          </button>

        </div>

      </div>
    `;

    grid.appendChild(card);

  });


  document.getElementById("empty").style.display=
    filtered.length ? "none" : "block";
}


/* SEARCH */
function searchProducts(){
  renderProducts();
}


/* SEARCH WHILE TYPING */
document
.getElementById("searchBox")
.addEventListener("input",renderProducts);


/*
  BUY BUTTON

  Opens your Paystack Payment Page.

  The customer can enter their
  own amount there.
*/
function buyProduct(productName){

  const encodedProduct=
    encodeURIComponent(productName);

  const url=
    PAYSTACK_LINK +
    "?product=" +
    encodedProduct;

  window.location.href=url;
}


/*
  PAYMENT BUTTON

  Opens the same Paystack page.
*/
function payProduct(productName){

  const encodedProduct=
    encodeURIComponent(productName);

  const url=
    PAYSTACK_LINK +
    "?product=" +
    encodedProduct;

  window.location.href=url;
}


/* INITIAL LOAD */
renderProducts();

</script>

</body>
</html>
