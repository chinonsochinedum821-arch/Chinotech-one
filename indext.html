<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHINOTECH1 Marketplace</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      font-size: 25px;
      margin-bottom: 6px;
    }

    header p {
      color: #cbd5e1;
    }

    .container {
      width: 94%;
      max-width: 1100px;
      margin: 20px auto;
    }

    .top-area {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    #searchInput {
      flex: 1;
      min-width: 200px;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    #searchButton,
    #sellButton {
      border: none;
      border-radius: 8px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #searchButton {
      background: #2563eb;
      color: white;
    }

    #sellButton {
      background: #16a34a;
      color: white;
    }

    #searchButton:active,
    #sellButton:active {
      transform: scale(0.97);
    }

    .form-box {
      display: none;
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .form-box h2 {
      margin-bottom: 15px;
    }

    .form-box input,
    .form-box textarea {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    .form-box textarea {
      min-height: 100px;
      resize: vertical;
    }

    .submit-btn {
      width: 100%;
      background: #16a34a;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .cancel-btn {
      width: 100%;
      background: #dc2626;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 7px;
      font-size: 15px;
      margin-top: 8px;
      cursor: pointer;
    }

    .section-title {
      margin-bottom: 15px;
      font-size: 22px;
    }

    #vehicleGrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 18px;
    }

    .vehicle-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .vehicle-card img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #ddd;
    }

    .vehicle-info {
      padding: 15px;
    }

    .vehicle-info h3 {
      margin-bottom: 8px;
      font-size: 19px;
    }

    .price {
      color: #16a34a;
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .location {
      color: #555;
      margin-bottom: 8px;
    }

    .description {
      color: #555;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .delete-btn {
      background: #dc2626;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    .contact-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 5px;
    }

    .no-results {
      background: white;
      padding: 25px;
      text-align: center;
      border-radius: 10px;
      color: #666;
    }

    footer {
      text-align: center;
      padding: 25px;
      margin-top: 30px;
      background: #111827;
      color: white;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 21px;
      }

      #searchButton,
      #sellButton {
        width: 100%;
      }

      .top-area {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🚗 CHINOTECH1 Marketplace</h1>
    <p>Buy and sell vehicles easily</p>
  </header>

  <main class="container">

    <!-- SEARCH -->
    <div class="top-area">

      <input
        type="text"
        id="searchInput"
        placeholder="Search vehicle, location or price..."
      >

      <button id="searchButton" type="button">
        🔎 Search
      </button>

      <button id="sellButton" type="button">
        🚗 Sell a Vehicle
      </button>

    </div>

    <!-- SELL FORM -->
    <div class="form-box" id="sellForm">

      <h2>List Your Vehicle</h2>

      <input
        type="text"
        id="vehicleName"
        placeholder="Vehicle name e.g. Toyota Camry 2021"
      >

      <input
        type="number"
        id="vehiclePrice"
        placeholder="Price in Naira e.g. 12500000"
      >

      <input
        type="text"
        id="vehicleLocation"
        placeholder="Location e.g. Onitsha, Anambra"
      >

      <input
        type="url"
        id="vehicleImage"
        placeholder="Vehicle image URL"
      >

      <textarea
        id="vehicleDescription"
        placeholder="Describe the vehicle..."
      ></textarea>

      <button class="submit-btn" id="submitListing" type="button">
        Publish Listing
      </button>

      <button class="cancel-btn" id="cancelListing" type="button">
        Cancel
      </button>

    </div>

    <h2 class="section-title">Available Vehicles</h2>

    <div id="vehicleGrid"></div>

  </main>

  <footer>
    <p>© 2026 CHINOTECH1 Marketplace</p>
    <p>Buy • Sell • Connect</p>
  </footer>


  <script>

    /* =========================================
       DEFAULT VEHICLES
    ========================================= */

    let vehicles = [
      {
        id: 1,
        name: "Toyota Camry 2021",
        price: 12500000,
        location: "Onitsha, Anambra",
        image: "https://images.unsplash.com/photo-1621007947382-bb3c3994e3fb?auto=format&fit=crop&w=800&q=80",
        description: "Clean Toyota Camry 2021. Comfortable interior and excellent condition."
      },

      {
        id: 2,
        name: "Lexus RX 350",
        price: 18500000,
        location: "Awka, Anambra",
        image: "https://images.unsplash.com/photo-1616422285623-13ff0162193c?auto=format&fit=crop&w=800&q=80",
        description: "Luxury SUV suitable for family and everyday driving."
      },

      {
        id: 3,
        name: "Honda Accord 2020",
        price: 11000000,
        location: "Enugu",
        image: "https://images.unsplash.com/photo-1606664515524-ed2f786a0bd6?auto=format&fit=crop&w=800&q=80",
        description: "Reliable Honda Accord in good condition."
      }
    ];


    /* =========================================
       LOAD SAVED VEHICLES
    ========================================= */

    const savedVehicles = localStorage.getItem("chinotech1Vehicles");

    if (savedVehicles) {
      try {
        vehicles = JSON.parse(savedVehicles);
      } catch (error) {
        console.log("Could not load saved listings.");
      }
    }


    /* =========================================
       SAVE VEHICLES
    ========================================= */

    function saveVehicles() {
      localStorage.setItem(
        "chinotech1Vehicles",
        JSON.stringify(vehicles)
      );
    }


    /* =========================================
       FORMAT PRICE
    ========================================= */

    function formatPrice(price) {

      return "₦" + Number(price).toLocaleString("en-NG");

    }


    /* =========================================
       DISPLAY VEHICLES
    ========================================= */

    function displayVehicles(list = vehicles) {

      const vehicleGrid =
        document.getElementById("vehicleGrid");

      vehicleGrid.innerHTML = "";

      if (list.length === 0) {

        vehicleGrid.innerHTML = `
          <div class="no-results">
            <h3>No vehicles found</h3>
            <p>Try another search.</p>
          </div>
        `;

        return;
      }


      list.forEach(function(vehicle) {

        const card = document.createElement("div");

        card.className = "vehicle-card";

        card.innerHTML = `

          <img
            src="${vehicle.image}"
            alt="${vehicle.name}"
            onerror="this.src='https://via.placeholder.com/800x500?text=Vehicle+Image'"
          >

          <div class="vehicle-info">

            <h3>${vehicle.name}</h3>

            <div class="price">
              ${formatPrice(vehicle.price)}
            </div>

            <div class="location">
              📍 ${vehicle.location}
            </div>

            <div class="description">
              ${vehicle.description}
            </div>

            <button
              class="contact-btn"
              onclick="contactSeller('${vehicle.name}')"
            >
              Contact Seller
            </button>

            <button
              class="delete-btn"
              onclick="deleteVehicle(${vehicle.id})"
            >
              Delete
            </button>

          </div>
        `;

        vehicleGrid.appendChild(card);

      });

    }


    /* =========================================
       SEARCH FUNCTION
    ========================================= */

    function searchVehicles() {

      const searchInput =
        document.getElementById("searchInput");

      const searchText =
        searchInput.value.trim().toLowerCase();


      if (searchText === "") {

        displayVehicles(vehicles);

        return;
      }


      const results = vehicles.filter(function(vehicle) {

        return (

          vehicle.name.toLowerCase().includes(searchText)

          ||

          vehicle.location.toLowerCase().includes(searchText)

          ||

          vehicle.description.toLowerCase().includes(searchText)

          ||

          String(vehicle.price).includes(searchText)

          ||

          formatPrice(vehicle.price)
            .toLowerCase()
            .includes(searchText)

        );

      });


      displayVehicles(results);

    }


    /* =========================================
       SEARCH BUTTON
    ========================================= */

    document
      .getElementById("searchButton")
      .addEventListener("click", function() {

        searchVehicles();

      });


    /* =========================================
       SEARCH WHILE TYPING
    ========================================= */

    document
      .getElementById("searchInput")
      .addEventListener("input", function() {

        searchVehicles();

      });


    /* =========================================
       ENTER KEY SEARCH
    ========================================= */

    document
      .getElementById("searchInput")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

          event.preventDefault();

          searchVehicles();

        }

      });


    /* =========================================
       SELL BUTTON
    ========================================= */

    document
      .getElementById("sellButton")
      .addEventListener("click", function() {

        const form =
          document.getElementById("sellForm");

        if (form.style.display === "block") {

          form.style.display = "none";

        } else {

          form.style.display = "block";

          form.scrollIntoView({
            behavior: "smooth"
          });

        }

      });


    /* =========================================
       CANCEL BUTTON
    ========================================= */

    document
      .getElementById("cancelListing")
      .addEventListener("click", function() {

        document.getElementById("sellForm").style.display = "none";

      });


    /* =========================================
       PUBLISH LISTING
    ========================================= */

    document
      .getElementById("submitListing")
      .addEventListener("click", function() {

        const name =
          document.getElementById("vehicleName").value.trim();

        const price =
          document.getElementById("vehiclePrice").value.trim();

        const location =
          document.getElementById("vehicleLocation").value.trim();

        const image =
          document.getElementById("vehicleImage").value.trim();

        const description =
          document.getElementById("vehicleDescription").value.trim();


        /* CHECK REQUIRED FIELDS */

        if (
          name === "" ||
          price === "" ||
          location === "" ||
          description === ""
        ) {

          alert("Please fill in the vehicle name, price, location and description.");

          return;

        }


        /* IMAGE DEFAULT */

        let finalImage = image;

        if (finalImage === "") {

          finalImage =
            "https://via.placeholder.com/800x500?text=Vehicle+Image";

        }


        /* CREATE NEW VEHICLE */

        const newVehicle = {

          id: Date.now(),

          name: name,

          price: Number(price),

          location: location,

          image: finalImage,

          description: description

        };


        /* ADD VEHICLE */

        vehicles.unshift(newVehicle);


        /* SAVE */

        saveVehicles();


        /* REFRESH DISPLAY */

        displayVehicles(vehicles);


        /* CLEAR FORM */

        document.getElementById("vehicleName").value = "";

        document.getElementById("vehiclePrice").value = "";

        document.getElementById("vehicleLocation").value = "";

        document.getElementById("vehicleImage").value = "";

        document.getElementById("vehicleDescription").value = "";


        /* HIDE FORM */

        document.getElementById("sellForm").style.display = "none";


        /* MESSAGE */

        alert("Vehicle listed successfully!");


        /* SHOW NEW LISTING */

        document.getElementById("vehicleGrid")
          .scrollIntoView({
            behavior: "smooth"
          });

      });


    /* =========================================
       DELETE VEHICLE
    ========================================= */

    function deleteVehicle(id) {

      const confirmed =
        confirm("Are you sure you want to delete this listing?");

      if (!confirmed) {

        return;

      }


      vehicles =
        vehicles.filter(function(vehicle) {

          return vehicle.id !== id;

        });


      saveVehicles();

      displayVehicles(vehicles);

    }


    /* =========================================
       CONTACT SELLER
    ========================================= */

    function contactSeller(vehicleName) {

      alert(
        "You selected: " +
        vehicleName +
        "\n\nSeller contact can be connected here later."
      );

    }


    /* =========================================
       START WEBSITE
    ========================================= */

    displayVehicles(vehicles);

  </script>

</body>
</html>
