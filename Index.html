<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHINOTECH1 Marketplace</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .logo span {
      color: #f59e0b;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 11px 15px;
      font-weight: bold;
    }

    .sell-button {
      background: #f59e0b;
      color: #111827;
    }

    .hero {
      background: #1f2937;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    .hero h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .hero p {
      margin-bottom: 20px;
      color: #d1d5db;
    }

    .search {
      width: 100%;
      max-width: 600px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 15px;
      background: white;
    }

    .category {
      min-width: 90px;
      background: #f3f4f6;
      border: 1px solid #ddd;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .title {
      margin-bottom: 18px;
    }

    .cars {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
    }

    .car {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .car img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .car-info {
      padding: 15px;
    }

    .price {
      color: #d97706;
      font-size: 20px;
      font-weight: bold;
      margin: 10px 0;
    }

    .details {
      width: 100%;
      background: #111827;
      color: white;
    }

    .sell-section {
      background: white;
      margin-top: 35px;
      padding: 20px;
      border-radius: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    .publish {
      width: 100%;
      background: #f59e0b;
      color: #111827;
      margin-top: 8px;
    }

    footer {
      background: #111827;
      color: white;
      text-align: center;
      padding: 25px;
      margin-top: 40px;
    }
  </style>
</head>

<body>

<header>
  <div class="top">
    <div class="logo">
      CHINOTECH<span>1</span>
    </div>

    <button class="sell-button" onclick="goToSell()">
      Sell Vehicle
    </button>
  </div>
</header>

<section class="hero">

  <h1>CHINOTECH1 Marketplace</h1>

  <p>
    Buy and sell cars, bikes, trucks and other vehicles.
  </p>

  <input
    class="search"
    id="search"
    type="text"
    placeholder="Search for Toyota, Honda, Lexus..."
    onkeyup="searchVehicles()"
  >

</section>

<div class="categories">

  <button class="category" onclick="filterVehicles('All')">
    🚘 All
  </button>

  <button class="category" onclick="filterVehicles('Toyota')">
    Toyota
  </button>

  <button class="category" onclick="filterVehicles('Honda')">
    Honda
  </button>

  <button class="category" onclick="filterVehicles('Lexus')">
    Lexus
  </button>

  <button class="category" onclick="filterVehicles('Bike')">
    🏍️ Bikes
  </button>

  <button class="category" onclick="filterVehicles('Truck')">
    🚚 Trucks
  </button>

</div>

<main>

  <h2 class="title">
    Featured Vehicles
  </h2>

  <div class="cars" id="carList"></div>

  <section class="sell-section" id="sellSection">

    <h2>Sell Your Vehicle</h2>

    <p>
      Add your vehicle to CHINOTECH1 Marketplace.
    </p>

    <input
      id="name"
      placeholder="Vehicle name"
    >

    <select id="type">

      <option value="Toyota">Toyota</option>
      <option value="Honda">Honda</option>
      <option value="Lexus">Lexus</option>
      <option value="Bike">Bike</option>
      <option value="Truck">Truck</option>

    </select>

    <input
      id="price"
      type="number"
      placeholder="Price in ₦"
    >

    <input
      id="location"
      placeholder="Location"
    >

    <textarea
      id="description"
      placeholder="Vehicle description"
    ></textarea>

    <button
      class="publish"
      onclick="addVehicle()"
    >
      Publish Vehicle
    </button>

  </section>

</main>

<footer>

  <h3>CHINOTECH1 Marketplace</h3>

  <p>Buy • Sell • Discover</p>

  <p>© 2026 CHINOTECH1</p>

</footer>

<script>

let vehicles = [

  {
    name: "Toyota Camry",
    type: "Toyota",
    price: 8500000,
    location: "Nigeria",
    image:
      "https://images.unsplash.com/photo-1621007947382-bb3c3994e3fb"
  },

  {
    name: "Honda Accord",
    type: "Honda",
    price: 7200000,
    location: "Nigeria",
    image:
      "https://images.unsplash.com/photo-1552519507-da3b142c6e3d"
  },

  {
    name: "Lexus RX",
    type: "Lexus",
    price: 12500000,
    location: "Nigeria",
    image:
      "https://images.unsplash.com/photo-1511919884226-fd3cad34687c"
  },

  {
    name: "Premium Motorcycle",
    type: "Bike",
    price: 1200000,
    location: "Nigeria",
    image:
      "https://images.unsplash.com/photo-1558981806-ec527fa84c39"
  }

];

function displayVehicles(list) {

  const container =
    document.getElementById("carList");

  container.innerHTML = "";

  list.forEach(function(vehicle, index) {

    container.innerHTML += `

      <div class="car">

        <img
          src="${vehicle.image}"
          alt="${vehicle.name}"
        >

        <div class="car-info">

          <h3>
            ${vehicle.name}
          </h3>

          <p>
            📍 ${vehicle.location}
          </p>

          <div class="price">
            ₦${Number(vehicle.price).toLocaleString()}
          </div>

          <button
            class="details"
            onclick="showDetails(${index})"
          >
            View Details
          </button>

        </div>

      </div>

    `;

  });

}

function searchVehicles() {

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase();

  const results =
    vehicles.filter(function(vehicle) {

      return (
        vehicle.name.toLowerCase().includes(search) ||
        vehicle.type.toLowerCase().includes(search)
      );

    });

  displayVehicles(results);
}

function filterVehicles(type) {

  if (type === "All") {

    displayVehicles(vehicles);

    return;
  }

  const results =
    vehicles.filter(function(vehicle) {

      return vehicle.type === type;

    });

  displayVehicles(results);
}

function showDetails(index) {

  const vehicle = vehicles[index];

  alert(
    "Vehicle: " + vehicle.name +
    "\nPrice: ₦" +
    Number(vehicle.price).toLocaleString() +
    "\nLocation: " +
    vehicle.location
  );

}

function addVehicle() {

  const name =
    document.getElementById("name").value;

  const type =
    document.getElementById("type").value;

  const price =
    document.getElementById("price").value;

  const location =
    document.getElementById("location").value;

  if (!name || !price || !location) {

    alert(
      "Please enter the vehicle name, price and location."
    );

    return;
  }

  vehicles.push({

    name: name,

    type: type,

    price: price,

    location: location,

    image:
      "https://images.unsplash.com/photo-1492144534655-ae79c964c9d7"

  });

  displayVehicles(vehicles);

  alert(
    "Vehicle added to CHINOTECH1 Marketplace!"
  );

  document.getElementById("name").value = "";
  document.getElementById("price").value = "";
  document.getElementById("location").value = "";

}

function goToSell() {

  document
    .getElementById("sellSection")
    .scrollIntoView({
      behavior: "smooth"
    });

}

displayVehicles(vehicles);

</script>

</body>
</html>
